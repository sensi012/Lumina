name: Lumina CD

on:
  push:
    branches:
      - main
      - dev
  workflow_run:
    workflows: ["Lumina CI"]
    types:
      - completed
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  PROJECT_NAME: "lumina"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Deploy to DEV Environment (dev branch only)
  # ------------------------------------------------------------------
  deploy_dev:
    name: Deploy to dev Environment
    if: |
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/Dev')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'Dev'))
    runs-on: ubuntu-latest
    environment: dev
    env:
      ENVIRONMENT: "dev"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials (Dev OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: githubaction-lumina
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Create dev.tfvars from Secret
        env:
          TFVARS_DEV: ${{ secrets.TFVARS_DEV || secrets.TFVARS }}
        run: |
          if [ -n "$TFVARS_DEV" ]; then
            echo "$TFVARS_DEV" > terraform/dev.tfvars
          else
            echo "::error::TFVARS_DEV (or TFVARS) secret is missing in GitHub Secrets."
            exit 1
          fi

      - name: Terraform Init (dev)
        working-directory: ./terraform
        run: terraform init -reconfigure

      - name: Select or Create dev Workspace
        working-directory: ./terraform
        run: terraform workspace select -or-create dev

      - name: Terraform Plan & Drift Detection (dev)
        id: plan
        working-directory: ./terraform
        run: |
          set +e
          terraform plan -var-file="dev.tfvars" -detailed-exitcode -out=tfplan
          PLAN_EXIT_CODE=$?
          set -e

          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "No drift detected. Infrastructure matches configuration."
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "Infrastructure drift or pending changes detected."
          else
            echo "Terraform plan failed with exit code $PLAN_EXIT_CODE"
            exit $PLAN_EXIT_CODE
          fi

      - name: Terraform Apply (dev)
        working-directory: ./terraform
        run: terraform apply -var-file="dev.tfvars" -auto-approve 

      - name: Fetch Infrastructure Details
        id: infra
        working-directory: ./terraform
        run: |
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Sync site to S3 (dev)
        run: |
          aws s3 sync ./dist/ s3://${{ steps.infra.outputs.bucket_name }}/ --delete

      - name: Invalidate CloudFront cache (dev)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.infra.outputs.distribution_id }} \
            --paths "/*"

  # ------------------------------------------------------------------
  # Job 2: Deploy to PRODUCTION Environment (main branch only)
  # ------------------------------------------------------------------
  deploy_prod:
    name: Deploy to Production Environment
    if: |
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: prod
    env:
      ENVIRONMENT: "prod"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials (Prod OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Create Prod.tfvars from Secret
        env:
          TFVARS_PROD: ${{ secrets.TFVARS_PROD || secrets.TFVARS }}
        run: |
          if [ -n "$TFVARS_PROD" ]; then
            echo "$TFVARS_PROD" > terraform/terraform.tfvars
          else
            echo "::error::TFVARS_PROD (or TFVARS) secret is missing in GitHub Secrets."
            exit 1
          fi

      - name: Terraform Init (Prod)
        working-directory: ./terraform
        run: terraform init -reconfigure

      - name: Select or Create Prod Workspace
        working-directory: ./terraform
        run: terraform workspace select -or-create prod

      - name: Terraform Plan & Drift Detection (Prod)
        id: plan
        working-directory: ./terraform
        run: |
          set +e
          terraform plan -var-file="terraform.tfvars" -detailed-exitcode -out=tfplan
          PLAN_EXIT_CODE=$?
          set -e

          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "No drift detected. Infrastructure matches configuration."
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "Infrastructure drift or pending changes detected."
          else
            echo "Terraform plan failed with exit code $PLAN_EXIT_CODE"
            exit $PLAN_EXIT_CODE
          fi

      - name: Terraform Apply (Prod)
        working-directory: ./terraform
        run: terraform apply -var-file="terraform.tfvars" -auto-approve

      - name: Fetch Infrastructure Details
        id: infra
        working-directory: ./terraform
        run: |
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Sync site to S3 (Prod)
        run: |
          aws s3 sync ./dist/ s3://${{ steps.infra.outputs.bucket_name }}/ --delete

      - name: Invalidate CloudFront cache (Prod)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.infra.outputs.distribution_id }} \
            --paths "/*"